[project]
name = "trading-god"
version = "0.1.0"
description = "AI-driven prosperity investment analysis & backtesting system"
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.14.0",
    "tushare>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "duckdb>=1.1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8.0",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "jupyter>=1.0",
]
